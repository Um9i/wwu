[build-system]
requires = ["setuptools>=41.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wwu"
version = "0.0.3"
description = "Find the optimal way up to store your boxes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Rob Horton", email = "vulgarmessiah@gmail.com" },
]
keywords = ["boxes", "containers", "inventory", "permutation", "combinatorics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Programming Language :: Python",
]

[project.urls]
Homepage = "https://github.com/Um9i/wwu"
Download = "https://github.com/Um9i/wwu/archive/master.zip"

[project.optional-dependencies]
test = ["pytest"]
lint = ["ruff"]

[tool.setuptools.package-data]
wwu = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
